    <main class="min-vh-100" id="adminLoginMain">
        <div id="loginHero">
        </div>
        <div class="d-flex" style="background-image: " id="adminLogin">
            <div class="card" id="loginCard">
            <div class="card-body">
                <h5 class="card-title text-center d-flex flex-column justify-content-center align-items-center">
                    <img src="images/portfolio-icon.png" alt="" class="w-25">
                    <div style="font-size: 1.5em;">
                        Welcome Back, <span id="adminName">Aryan</span>
                    </div>
                </h5>
                <form class="d-flex flex-column justify-content-center align-items-center">
                    <label for="">Username:</label>
                    <div class="username-container">
                        <input type="text" id="adminUsername" name="username" placeholder="Type your username here..." style="max-width: 400px;">
                    </div>
                </form>
                <form class="d-flex flex-column justify-content-center align-items-center">
                    <label for="">Password:</label>
                    <div class="password-container">
                        <input type="password" id="adminPassword" placeholder="Type your password here..." style="max-width: 400px; box-sizing: border-box;">
                        <!-- Eye Toggle -->
                         <button class="mt-1 mx-2" style="background: transparent; border: none; color: gold;" id="togglePassword">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye-fill"
                                viewBox="0 0 16 16">
                                <path d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0" />
                                <path d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8m8 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7" />
                            </svg>
                         </button>
                    </div>
                </form>
                <!-- reCaptcha - set up later
                <form action="?" method="POST" class="d-flex">
                    <div class="g-recaptcha" data-sitekey="your_site_key"></div>
                </form>
                -->
                <p class="text-center text-incorrect"></p>
                <div class="text-center">
                    <button id="loginBtn" class="btn btn-primary text-center">Submit</button>
                </div>
            </div>
            </div>
        </div>
